name: Create and publish a Docker image

on:
  push:
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JVM
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - name: Install sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Docker labels
        run: |
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "DOCKER_LABELS=${{ github.sha }},${{ github.ref_name }},latest" >> $GITHUB_ENV
          else
            echo "DOCKER_LABELS=${{ github.sha }},$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9_.-]/_/g')" >> $GITHUB_ENV
          fi
      - name: Build and push Docker image
        run: sbt app/Docker/publish
        env:
          VERSION: ${{ github.sha }}

  deploy:
    if: github.repository_owner == 'lichess-org' && github.ref_name == github.event.repository.default_branch
    needs: build-and-push-image
    uses: lichess-org/.github/.github/workflows/deploy.yml@main
    secrets:
      deploy_webhook_url: ${{ secrets.DEPLOY_WEBHOOK_URL }}
